[project]
name = "kompas-hw01-eda"
version = "0.1.0"
description = "Автономный EDA-ноутбук учебного набора CAD"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.2,<5",
    "ipykernel>=6.29,<8",
    "nbconvert>=7.16,<8",
    "pandas>=2.2,<4",
    "numpy>=2,<3",
    "matplotlib>=3.9,<4",
    "pillow>=11,<14",
    "trimesh>=4.6,<6",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pre-commit>=4.7",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
