[project]
name = "kompas-auto-draft"
version = "0.1.0"
description = "Генерация 3D-модели по изображению чертежа в КОМПАС-3D"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.7",
    "ruff>=0.17",
    "pytest>=8",
]
eval = [
    "pydantic>=2.9", "numpy>=2,<3", "scipy>=1.14,<2", "trimesh>=4.6,<6",
    "rtree>=1.3,<2", "libigl>=2.6.3,<3", "rich>=13.9,<15", "matplotlib>=3.9",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["kompas_data", "reports", "vendor", "runs", "eval", "artifacts", "data"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, blind-except, ruff-specific
select = ["E", "F", "I", "UP", "B", "BLE", "RUF"]
# Тексты и комментарии на русском: кириллица не считается «похожими» символами
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
