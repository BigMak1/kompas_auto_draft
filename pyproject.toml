[project]
name = "kompas_auto_draft"
version = "0.3.0"
description = "PNG → один ответ LLM → CadQuery → STL; независимая оценка IoU и F-score"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai-agents==0.24.0",
    "pydantic>=2,<3",
    "pillow>=11",
    "cadquery==2.7.0",
    "trimesh==4.12.2",
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "rtree>=1.4,<2",
    "manifold3d>=3,<4",
    "pyyaml>=6,<7",
    "rich>=13,<15",
    "poethepoet>=0.40,<1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.17", "pre-commit>=4.7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.poe]
verbosity = -1

[tool.poe.tasks]
help = { cmd = "poe --help", help = "Показать команды проекта" }
run = { cmd = "python -m src.agent run", envfile = { optional = [".env"] }, help = "Построить весь набор; одну деталь: poe run KF0027" }
build = { cmd = "python -m src.agent build", help = "Построить STL из готового рецепта" }
evaluate = { cmd = "python -m src.evaluate", help = "IoU, F-score и среднее по проверочным деталям" }
lint = { cmd = "ruff check src tests", help = "Линт" }
format = { cmd = "ruff format src tests", help = "Форматирование Python" }
format-check = { cmd = "ruff format --check src tests", help = "Проверить форматирование" }
test = { cmd = "pytest -q", help = "Тесты" }
data-check = { cmd = "python -m src.agent check", help = "Конфиг и контрольные суммы данных" }
check = { sequence = ["lint", "format-check", "test", "data-check"], help = "Все проверки проекта" }
hooks = { cmd = "pre-commit run --all-files", help = "Проверки pre-commit" }
