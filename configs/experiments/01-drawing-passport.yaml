# Исследование влияния паспорта: четыре маршрута при одинаковых общих условиях.
# Пути — от корня репозитория. name — версия исследования; тексты редактируются в MLflow Prompts.
# Все пределы относятся ко всему маршруту, а не к каждому запросу.
number: 1
title: Влияние паспорта чертежа
description: Сравнение прямой генерации, паспорта, паспорта с PNG и свободных заметок.
name: 01-drawing-passport-v5
agent_version: cad-agent-v4
dataset_version: drawing-cad-v3
prompts:
  builder: prompts:/cad-builder/1
  passport: prompts:/drawing-passport/3
  notes: prompts:/drawing-notes/2
manifest: data/manifest-experiments.json
variants: [direct, passport_only, passport_png, notes_png]
repeats: 3
validation_size: 5
order_seed: 20261115
progress_interval_seconds: 30

agent:
  model: gpt-6.1-sol
  reasoning_effort: medium
  timeout_seconds: 900
  max_output_tokens: 16384
  image_detail: high
  image_max_side: 4096

reading:
  max_output_tokens: 8192

cad:
  stl_tolerance_mm: 0.01
  stl_angle_rad: 0.05

evaluation:
  surface_samples: 8192
  seed: 20261107
  tau_relative: 0.01
  intersection_roundoff_relative: 0.000001
