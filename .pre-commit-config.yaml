# Ruff берётся из основного окружения и uv.lock.
files: ^(src|tests)/.*\.py$
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Линт Python
        entry: uv run --locked ruff check
        language: unsupported
        types: [python]
      - id: ruff-format
        name: Форматирование Python
        entry: uv run --locked ruff format --check
        language: unsupported
        types: [python]
