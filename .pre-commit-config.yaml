# Проверяем baseline, тесты и Python-код ноутбуков средствами основного окружения.
files: ^((src|tests)/.*\.py|notebooks/.*\.(py|ipynb))$
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Линт Python и EDA
        entry: uv run --locked ruff check
        language: unsupported
        types_or: [python, jupyter]
      - id: ruff-format
        name: Форматирование Python и EDA
        entry: uv run --locked ruff format --check
        language: unsupported
        types_or: [python, jupyter]
